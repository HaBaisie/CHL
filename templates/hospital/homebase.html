<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HMS - Django</title>
  <style media="screen">
    /* Keep wide tables scrollable instead of breaking the layout on small screens */
    @media (max-width: 767.98px) {
      table.table { display: block; overflow-x: auto; white-space: nowrap; }
    }
  </style>
</head>

<body>
  {% include "hospital/navbar.html" %}
  {%block content%}

  {%endblock content%}
  {% include "hospital/footer.html" %}
</body>


</html>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const input = document.querySelector('input[name="q"]');
    if (!input) return;
    const rows = document.querySelectorAll('table tbody tr');

    input.addEventListener('input', function () {
        const term = this.value.toLowerCase();
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(term) ? '' : 'none';
        });
    });
});
</script>
